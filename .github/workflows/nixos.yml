name: NixOS

on:
  push:
    branches:
      - main

  pull_request:

  schedule:
    - cron: "0 3 */3 * *"

  workflow_dispatch:

permissions:
  contents: read

env:
  CACHIX_CACHE: tomekbobrowicz-nix

jobs:
  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@8aa0397 # v31.10.6
        with:
          github_access_token: ${{ github.token }}

      - name: Setup Cachix
        uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake
        run: |
          nix flake check \
            --all-systems \
            --print-build-logs

  build-fury:
    name: Build fury
    runs-on: ubuntu-latest
    needs: flake-check
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@8aa0397 # v31.10.6
        with:
          github_access_token: ${{ github.token }}

      - name: Setup Cachix
        uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build fury
        run: |
          nix build \
            --print-build-logs \
            .#nixosConfigurations.fury.config.system.build.toplevel

  build-kinetix:
    name: Build kinetix
    runs-on: ubuntu-latest
    needs: flake-check
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@8aa0397 # v31.10.6
        with:
          github_access_token: ${{ github.token }}

      - name: Setup Cachix
        uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build kinetix
        run: |
          nix build \
            --print-build-logs \
            .#nixosConfigurations.kinetix.config.system.build.toplevel