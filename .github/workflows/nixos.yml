name: NixOS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Check flake
        run: nix flake check --all-systems

      - name: Check formatting
        run: nix fmt -- --check

  build-fury:
    name: Build fury
    runs-on: ubuntu-latest
    needs: flake-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build fury
        run: |
          nix build .#nixosConfigurations.fury.config.system.build.toplevel

  build-kinetix:
    name: Build kinetix
    runs-on: ubuntu-latest
    needs: flake-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build kinetix
        run: |
          nix build .#nixosConfigurations.kinetix.config.system.build.toplevel
