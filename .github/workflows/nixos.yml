name: NixOS

on:
  push:
    branches:
      - main

  pull_request:

  schedule:
    - cron: "0 3 */3 * *"

  workflow_dispatch:

permissions:
  contents: read

env:
  CACHIX_CACHE: tomekbobrowicz-nix

jobs:
  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ github.token }}

      - name: Configure Nix
        run: |
          mkdir -p "$HOME/.config/nix"

          cat > "$HOME/.config/nix/nix.conf" <<EOF
          access-tokens = github.com=${{ github.token }}
          EOF

      - name: Flake check
        run: |
          nix flake check \
            --all-systems \
            --print-build-logs

  build-fury:
    name: Build fury
    runs-on: ubuntu-latest
    needs: flake-check

    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ github.token }}

      - name: Configure Nix
        run: |
          mkdir -p "$HOME/.config/nix"

          cat > "$HOME/.config/nix/nix.conf" <<EOF
          access-tokens = github.com=${{ github.token }}
          EOF

      - name: Install Cachix CLI
        run: |
          nix profile install nixpkgs#cachix

      - name: Configure Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          cachix use "$CACHIX_CACHE"

      - name: Build and cache fury
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          cachix watch-exec "$CACHIX_CACHE" -- \
            nix build \
              --print-build-logs \
              .#nixosConfigurations.fury.config.system.build.toplevel

  build-kinetix:
    name: Build kinetix
    runs-on: ubuntu-latest
    needs: flake-check

    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ github.token }}

      - name: Configure Nix
        run: |
          mkdir -p "$HOME/.config/nix"

          cat > "$HOME/.config/nix/nix.conf" <<EOF
          access-tokens = github.com=${{ github.token }}
          EOF

      - name: Install Cachix CLI
        run: |
          nix profile install nixpkgs#cachix

      - name: Configure Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          cachix use "$CACHIX_CACHE"

      - name: Build and cache kinetix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          cachix watch-exec "$CACHIX_CACHE" -- \
            nix build \
              --print-build-logs \
              .#nixosConfigurations.kinetix.config.system.build.toplevel