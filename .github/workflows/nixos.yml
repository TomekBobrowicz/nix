name: NixOS

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: tomekbobrowicz-nix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Check flake
        run: nix flake check --all-systems

  build-fury:
    name: Build fury
    runs-on: ubuntu-latest
    needs: flake-check
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: tomekbobrowicz-nix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build fury
        run: |
          nix build \
            --print-build-logs \
            .#nixosConfigurations.fury.config.system.build.toplevel

  build-kinetix:
    name: Build kinetix
    runs-on: ubuntu-latest
    needs: flake-check
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: tomekbobrowicz-nix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build kinetix
        run: |
          nix build \
            --print-build-logs \
            .#nixosConfigurations.kinetix.config.system.build.toplevel